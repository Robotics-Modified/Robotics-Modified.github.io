<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Lang File Creator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <h1>Minecraft Lang File Creator</h1>

        <section class="creator card">
            <label for="languageCode">Language Code (example: en_US):</label>
            <input id="languageCode" type="text" placeholder="en_US" autocomplete="off">
            <button id="createBtn" class="primary">Create Files</button>
        </section>

        <section class="languages card">
            <label for="languageSelect">Created / Loaded Languages:</label>
            <div class="language-actions">
                <select id="languageSelect">
                    <option value="">No files loaded</option>
                </select>
                <button id="editBtn">Edit Selected</button>
                <button id="deleteBtn" class="danger">Delete Selected</button>
            </div>
            <div class="file-actions">
                <button id="openBtn">Open .lang and .data.json</button>
                <input id="filePicker" type="file" multiple accept=".lang,.json" hidden>
                <button id="downloadBtn">Download Selected Files</button>
            </div>
            <p class="hint">
                This browser version cannot silently write to arbitrary folders. It creates files for download.
                Loaded languages are remembered in this browser.
            </p>
        </section>

        <section id="editor" class="editor card hidden">
            <div class="editor-title-row">
                <h2 id="editorTitle">Translations</h2>
                <button id="closeEditorBtn">Close</button>
            </div>

            <div class="translation-header">
                <span>ID</span>
                <span>Translation</span>
                <span></span>
            </div>

            <div id="rows"></div>

            <div class="editor-buttons">
                <button id="addBtn">+ Add Translation</button>
                <button id="saveBtn" class="primary">Save Changes</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
